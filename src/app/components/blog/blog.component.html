<main class="wrapper">
    <aside class="form">
        <p> aquí introduciremos los inputs para dar de alta las noticias</p>

        <input type="text" name="title" id="title" placeholder="Título de la noticia" required>
        <textarea class="description" name="description" id="description" placeholder="Descripción de la noticia" maxlength="2000" required></textarea>
        <input type="text" name="image" id="image" placeholder="URL de la imagen de la noticia" required>
        <input type="date" name="date" id="date" placeholder="Fecha de la noticia" required>
        <button>Agregar noticia</button>

    </aside>

    <section class="listNews">
        
        <h2> Listado dinámico de Noticias</h2>
        @for( noticia of arrayNews; track noticia.fecha ){
        <article>
        
        <h3>{{noticia.titulo}}</h3>
         <p>{{noticia.fecha}}</p>   
        <p>{{noticia.descripcion}}</p>
        <figure>
            <img [src]="noticia.imagen" [alt]="noticia.titulo">
        </figure>
        </article>
    }
    </section>
</main>
